<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Sadaf Liaquat Ali - SEO Specialist">
  <defs>
    <!-- Premium gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Soft glow -->
    <radialGradient id="glow1" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft shadow for text -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow2)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="70" r="110" fill="#fbbf24" opacity="0.18"/>
  <circle cx="1020" cy="260" r="70" fill="#22d3ee" opacity="0.18"/>
  <circle cx="1120" cy="200" r="40" fill="#fff" opacity="0.12"/>

  <!-- Main Name -->
  <text x="60" y="125" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-weight="800" font-size="68" fill="#ffffff" filter="url(#textShadow)">Sadaf Liaquat Ali</text>

  <!-- Tagline -->
  <text x="60" y="175" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-weight="500" font-size="28" fill="#fce7f3">SEO Specialist  •  Helping businesses get found on Google</text>

  <!-- Stats pills -->
  <g font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-weight="600" font-size="18">
    <!-- Pill 1 -->
    <rect x="60" y="220" width="195" height="42" rx="21" fill="#ffffff" fill-opacity="0.18"/>
    <text x="80" y="247" fill="#ffffff">5+ Years in SEO</text>

    <!-- Pill 2 -->
    <rect x="275" y="220" width="310" height="42" rx="21" fill="#ffffff" fill-opacity="0.18"/>
    <text x="295" y="247" fill="#ffffff">15.2K Clicks • Mattie Nottage</text>

    <!-- Pill 3 -->
    <rect x="605" y="220" width="330" height="42" rx="21" fill="#ffffff" fill-opacity="0.18"/>
    <text x="625" y="247" fill="#ffffff">249K Impressions • E Movement</text>
  </g>
</svg>